name: Test PHP

on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON array of PHP versions to test against (e.g. '["8.1","8.2","8.3"]')
        type: string
        default: '["8.1", "8.2", "8.3"]'
      wp-version:
        description: WordPress version to test against (e.g. latest, 6.4, nightly)
        type: string
        default: latest
      mysql-version:
        description: MySQL Docker image tag to use
        type: string
        default: '8.0'
      phpunit-config:
        description: Path to PHPUnit configuration file
        type: string
        default: phpunit.xml.dist

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:${{ inputs.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(inputs.php-versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, pdo_mysql
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ inputs.wp-version }}

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --configuration ${{ inputs.phpunit-config }}
